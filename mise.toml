[tools]
go = "1.26.4"
golangci-lint = "2.12.2"

[tasks."cover"]
description = "Run the root-module race tests and write a single merged coverage profile (coverage.out)"
# GOWORK=off scopes the run to the root module's go.mod even when the go.work workspace is present,
# so the profile and its floor reflect the library only (cmd/radx is gated by its own job).
# -coverpkg=./... puts every root-module statement in the denominator regardless of which test
# binary exercises it; -covermode=atomic is required alongside -race.
run = "GOWORK=off go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."

[tasks."cover:check"]
description = "Fail if aggregate coverage is below the PRD floor (§11.4); writes coverage.out first"
depends = ["cover"]
run = "tools/cover-check.sh coverage.out"

[tasks."cover:critical"]
description = "Fail if a critical-path package is below the 90% target (or a ratchet package regressed); reuses coverage.out"
# Depends on `cover` so the merged race profile exists, then enforces the per-package 90%
# critical-path target on top of the module-wide 80% floor cover:check enforces. It reads the SAME
# coverage.out cover wrote, so the two gates share one expensive race run rather than two.
depends = ["cover"]
run = "tools/cover-critical.sh coverage.out"

[tasks."test:dicom"]
description = "Run the dicom package test suite (race + coverage)"
run = "go test -race -cover ./dicom/..."

[tasks."test:dimse"]
description = "Run the dimse package test suite (race + coverage)"
run = "go test -race -cover ./dimse/..."

[tasks."test:dicomweb"]
description = "Run the dicomweb package test suite (race + coverage)"
run = "go test -race -cover ./dicomweb/..."

[tasks."test:hl7v2"]
description = "Run the hl7v2 package test suite (race + coverage)"
run = "go test -race -cover ./hl7v2/..."

[tasks."test:fhir"]
description = "Run the fhir package test suite (race + coverage)"
run = "go test -race -cover ./fhir/..."

[tasks."test:convert"]
description = "Run the convert package test suite (race + coverage)"
run = "go test -race -cover ./convert/..."

[tasks."test:fhir-gen"]
description = "Run the FHIR generator (fhir/internal) test suite (race)"
run = "go test -race ./fhir/internal/..."

[tasks."gen:fhir-r4"]
description = "Regenerate the FHIR R4 (4.0.1) release package from the pinned definition bundle"
dir = "fhir"
run = "go run ./internal/gen/cmd/fhir-gen -release r4"

[tasks."gen:fhir-r5"]
description = "Regenerate the FHIR R5 release package from the pinned definition bundle (functional from M6 Increment 1)"
dir = "fhir"
run = "go run ./internal/gen/cmd/fhir-gen -release r5"

[tasks."gen:fhir"]
description = "Regenerate every FHIR release package from the pinned definition bundles (functional from M6 Increment 1)"
run = "go generate ./fhir/..."

[tasks."gen:verify"]
description = "Regenerate the FHIR release packages and fail on any drift from the committed tree"
# The byte-for-byte regeneration test is the authoritative gate: it regenerates into a temp dir
# and diffs against the committed files, so a hand edit or an un-regenerated generator change fails
# with a precise message and without depending on git staging. The trailing git diff catches the
# rarer case where the committed tree itself was edited and committed.
run = "go test ./fhir/internal/gen/ -run TestRegenerationByteForByte && go generate ./fhir/... && git diff --exit-code -- fhir/r4 fhir/r5"

[tasks."fhir:refresh-r5"]
description = "Refresh-only: re-download and re-checksum the vendored HL7 FHIR R5 definition bundle (never run at generate time)"
run = "tools/fhir-definitions/refresh.sh r5"

[tasks."fhir:refresh-r4"]
description = "Refresh-only: re-download and re-checksum the vendored HL7 FHIR R4 definition bundle (never run at generate time)"
run = "tools/fhir-definitions/refresh.sh r4"

[tasks."test:skeleton"]
description = "Run the M2 walking-skeleton package suites (race + coverage)"
run = "go test -race -cover ./dimse/... ./dicomweb/... ./hl7v2/... ./fhir/... ./convert/... ./server/..."

[tasks."interop:dimse"]
description = "Run the DIMSE interop gate against the Orthanc/dcm4chee-arc containers"
run = "go test -tags interop -count=1 -v ./dimse/integration/..."

[tasks."interop:dicomweb"]
description = "Run the DICOMweb interop gate against the Orthanc container"
run = "go test -tags interop -count=1 -v ./dicomweb/integration/..."

[tasks."interop:convert"]
description = "Run the cross-standard convert end-to-end interop gate against the Orthanc containers"
run = "go test -tags interop -count=1 -v ./convert/..."

[tasks."interop:mllp"]
description = "Run the HL7 v2.x MLLP interop gate against the python-hl7 peer container"
run = "go test -tags interop -count=1 -v ./hl7v2/..."

[tasks."interop:fhir-hapi"]
description = "Run the FHIR REST client interop gate against the HAPI FHIR server container"
run = "go test -tags interop -count=1 -v ./fhir/rest/..."

[tasks."dicom:dciodvfy"]
description = "Validate written DICOM files with dcmtk dciodvfy (skips if absent)"
run = "tools/dicom-conformance/dciodvfy.sh"

[tasks."dicom:pydicom"]
description = "Round-trip vendored fixtures through pydicom (skips if absent)"
run = "python3 tools/dicom-conformance/pydicom_roundtrip.py testdata/dicom"

[tasks."conformance:fhir"]
description = "Validate the go-radx FHIR R4 + R5 workflow sets with the pinned HL7 FHIR validator (skips if Java/jar absent; the negative fixture must be rejected at each version)"
run = "tools/fhir-conformance/validate.sh"

[tasks."lint"]
description = "Run golangci-lint (2.x, Go 1.26 compatible)"
run = "golangci-lint run ./..."

[tasks."pin-drift"]
description = "Fail if any reference tool or interop image has floated back to an unpinned reference"
run = "tools/pin-drift.sh"

[tasks."conformance-drift"]
description = "Fail if a conformance statement and the code it describes diverge (counts, banners, stability markers)"
run = "go test ./tools/conformance-drift/..."

[tasks."phi-sweep"]
description = "Run the PHI-default log sweep: fail if a patient identifier reaches a sink under default config"
# Scopes to the root module; the sweep uses synthetic sentinels only, never real PHI.
run = "GOWORK=off go test ./internal/phisweep/..."

[tasks."cred-sweep"]
description = "Run the credential-leak sweep: fail if an auth secret reaches a sink under default config"
# Scopes to the root module; the sweep uses synthetic credential sentinels only, never real secrets.
run = "GOWORK=off go test ./internal/credsweep/..."

[tasks."fuzz"]
description = "Bounded fuzz smoke over every target (discovered from go test -list, hang = failure)"
# The target list is DISCOVERED from `go test -list`, not hand-maintained, so it cannot drift out of
# step with the tree (a previously hand-kept list silently missed targets). Each discovered Fuzz
# function is bound to its package, then run with an anchored ^Name$ regex so a go-test fuzz run
# exercises exactly that one target (a fuzz run takes ONE target per invocation). Each invocation is
# wrapped in coreutils `timeout` at a wall-clock budget above -fuzztime, so a target that wedges
# exits non-zero — a hang is a FAILURE, never a skip. Requires `timeout` on PATH (present on Linux
# runners; macOS provides it as `gtimeout` via coreutils). FUZZTIME overrides the per-target budget
# locally (e.g. FUZZTIME=5s mise run fuzz).
# bash -c, not the default sh: on Ubuntu /bin/sh is dash, which rejects `set -o pipefail`.
shell = "bash -c"
run = """
set -euo pipefail
fuzztime="${FUZZTIME:-30s}"

run_one() {
  pkg="$1"; target="$2"
  for attempt in 1 2 3; do
    echo "fuzz: $target ($pkg) for $fuzztime (attempt $attempt)"
    out="$(timeout 120s go test -run='^$' -fuzz="$target" -fuzztime="$fuzztime" "$pkg" 2>&1)" && { echo "$out"; return 0; }
    rc=$?
    echo "$out"
    # A wedged target is killed by `timeout` (rc 124) and a reproducible crasher is saved under
    # testdata/fuzz — both are real FAILURES. Go's engine also exits non-zero with "context deadline
    # exceeded" when -fuzztime elapses while a worker is still mid-input on a loaded runner: a
    # boundary timing artifact, not a crash or a hang, so retry it. A genuine slow input that
    # reproduces the artifact on every attempt still fails the gate.
    if [ "$rc" -eq 124 ]; then
      echo "fuzz: $target wedged past the timeout budget — hang is a failure" >&2; return 1
    fi
    if printf '%s' "$out" | grep -qE 'Failing input written to|testdata[/]fuzz[/]'; then
      echo "fuzz: $target produced a reproducible crasher — failure" >&2; return 1
    fi
    if printf '%s' "$out" | grep -q 'context deadline exceeded'; then
      echo "fuzz: $target hit the -fuzztime boundary artifact; retrying" >&2; continue
    fi
    echo "fuzz: $target failed (exit $rc)" >&2; return 1
  done
  echo "fuzz: $target kept hitting the -fuzztime boundary artifact after 3 attempts — failing to be safe" >&2
  return 1
}

# Enumerate every Fuzz target and bind it to its package. Listed per-package so the package binding
# is unambiguous and the output cannot interleave across concurrently-listed packages. A compile
# failure surfaces because `go test -list` exits non-zero under `set -e` / `pipefail`.
count=0
while IFS= read -r pkg; do
  if ! list_out="$(go test -list '^Fuzz' "$pkg" 2>&1)"; then
    echo "fuzz: listing fuzz targets in $pkg failed (compile error?):" >&2
    echo "$list_out" >&2
    exit 1
  fi
  names="$(echo "$list_out" | grep '^Fuzz' || true)"
  [ -z "$names" ] && continue
  while IFS= read -r fn; do
    run_one "$pkg" "^${fn}\\$"
    count=$((count + 1))
  done <<< "$names"
done < <(go list ./...)

if [ "$count" -eq 0 ]; then
  echo "fuzz: no Fuzz targets discovered — the discovery step is broken" >&2
  exit 1
fi
echo "fuzz: ran $count target(s)"
"""

[tasks."hostile:corpus"]
description = "Replay the malformed-input corpus through its parsers under an enforced memory cap (GOMEMLIMIT) + timeout; OOM/panic/hang = failure"
# Two passes, both under one GOMEMLIMIT soft cap and a coreutils `timeout` wall-clock bound, so a
# parser that over-allocates is taken into a hard OOM abort (non-zero exit) and one that wedges is
# killed by `timeout` — both FAILURES, never skips:
#   1. the hostilecorpus harness, which feeds the RAW malformed corpus
#      (dicomweb/testdata/malformed) to the dicomweb JSON + multipart parsers; and
#   2. a replay of every committed Go-fuzz SEED corpus (a plain `go test -run '^Fuzz'` runs each
#      seed once as a subtest, no -fuzz), so the dicom, dimse/pdu, hl7v2, and fhir/r5 parser seeds
#      cross their parsers under the same cap.
# GOMEMLIMIT is a soft limit the GC works to honour; with the cap well above the corpus's tiny peak
# heap (logged by the harness), an over-allocation past it forces a hard out-of-memory abort. Tune
# the cap with HOSTILE_MEMLIMIT and the wall budget with HOSTILE_TIMEOUT. Requires `timeout` on PATH
# (present on Linux runners; macOS provides it as `gtimeout` via coreutils — the task picks whichever
# exists). GOWORK=off scopes the run to the root module.
# bash -c, not the default sh: on Ubuntu /bin/sh is dash, which rejects `set -o pipefail`.
shell = "bash -c"
env = { GOWORK = "off" }
run = """
set -euo pipefail
memlimit="${HOSTILE_MEMLIMIT:-512MiB}"
wall="${HOSTILE_TIMEOUT:-300}"

timeout_bin=timeout
if ! command -v timeout >/dev/null 2>&1; then
  if command -v gtimeout >/dev/null 2>&1; then
    timeout_bin=gtimeout
  else
    echo "hostile:corpus: no 'timeout' (or 'gtimeout') on PATH — install coreutils; a hang must be killable" >&2
    exit 1
  fi
fi

run_capped() {
  echo "hostile:corpus: $* (GOMEMLIMIT=$memlimit, timeout=${wall}s)"
  if GOMEMLIMIT="$memlimit" "$timeout_bin" "$wall" "$@"; then
    return 0
  fi
  rc=$?
  if [ "$rc" -eq 124 ]; then
    echo "hostile:corpus: command wedged past the ${wall}s budget — hang is a failure" >&2
  else
    echo "hostile:corpus: command failed (exit $rc) — a panic or out-of-memory abort under the cap is a failure" >&2
  fi
  return 1
}

# 1. The raw malformed corpus through the dicomweb parsers.
run_capped go test -count=1 ./internal/hostilecorpus/...
# 2. Every committed fuzz SEED corpus, replayed once each under the same cap (no -fuzz).
run_capped go test -count=1 -run '^Fuzz' ./dicom/... ./dimse/pdu/... ./hl7v2/... ./fhir/r5/... ./dicomweb/...

echo "hostile:corpus: malformed corpus + fuzz seeds replayed under the memory cap with no OOM/panic/hang"
"""

[tasks."bench"]
description = "Run the dicom + fhir benchmarks once (-benchtime=1x) so the benchmark code and baselines cannot rot"
# -run='^$' selects no unit tests so only benchmarks run; the pure-Go default build excludes the
# cgo-tagged codec benchmarks (covered by the codecs job). Scoped to the root module. The dicom and
# fhir benchmarks defend the committed baselines under docs/conformance/benchmarks/.
run = "GOWORK=off go test -bench=. -benchtime=1x -run='^$' ./dicom/... ./fhir/..."

[tasks."bench:compare"]
description = "Run the PRD 11.3 comparative harness (go-radx vs Python reference libraries); pass -- --mode smoke for a tiny-N validation run"
# Requires uv on PATH (see tools/bench-compare/README.md). The harness reuses the committed
# go test -bench suites for the DICOM rows and drives the gobench module + the pinned Python
# reference libraries for the rest; it rewrites the generated block in
# docs/conformance/benchmarks/comparative.md and drops JSON+md under tools/bench-compare/results/.
dir = "tools/bench-compare"
run = "uv sync --frozen && uv run python -m benchcompare"

[tasks."docs:build"]
# Requires mkdocs + mkdocs-material on PATH (pip install mkdocs mkdocs-material). The CI job that
# provisions this toolchain is wired by the gate-enforcement work; until then this is a local task.
description = "Build the mkdocs documentation site, failing on any nav drift (--strict)"
run = "mkdocs build --strict"

[tasks."docs:serve"]
# Requires mkdocs + mkdocs-material on PATH (see docs:build).
description = "Preview the mkdocs documentation site locally with live reload"
run = "mkdocs serve"

[tasks."radx:build"]
description = "Build the radx CLI from its own module (GOWORK=off) into cmd/radx/radx (gitignored)"
# GOWORK=off resolves the cmd/radx replace to the in-tree library (../..), exactly as the
# cmd-radx CI job and a downstream `go build` of the CLI module see it. The output path
# (cmd/radx/radx) is the one .gitignore already excludes, so the tracked-binary-hygiene gate
# stays satisfied. The release stamp is overridable via -ldflags; a plain build falls back to
# the embedded VCS stamp (radx --version reads runtime/debug.ReadBuildInfo when the vars are
# unset). To stamp a release, append:
#   -ldflags "-X github.com/codeninja55/go-radx/cmd/radx/internal/cli.version=vX.Y.Z \
#             -X .../internal/cli.commit=$(git rev-parse --short HEAD) \
#             -X .../internal/cli.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
dir = "cmd/radx"
env = { GOWORK = "off" }
run = "go build -o radx ."

[tasks."radx:run"]
description = "Run the radx CLI from its own module (GOWORK=off); pass args after --"
# `mise run radx:run -- echo localhost 11112 --format json` runs the in-tree CLI without a
# build artefact. GOWORK=off keeps resolution identical to the gated CI build.
dir = "cmd/radx"
env = { GOWORK = "off" }
run = "go run ."
