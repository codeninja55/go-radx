[tools]
go = "1.26.4"
golangci-lint = "2.12.2"

[tasks."test:dicom"]
description = "Run the dicom package test suite (race + coverage)"
run = "go test -race -cover ./dicom/..."

[tasks."test:dimse"]
description = "Run the dimse package test suite (race + coverage)"
run = "go test -race -cover ./dimse/..."

[tasks."test:dicomweb"]
description = "Run the dicomweb package test suite (race + coverage)"
run = "go test -race -cover ./dicomweb/..."

[tasks."test:hl7v2"]
description = "Run the hl7v2 package test suite (race + coverage)"
run = "go test -race -cover ./hl7v2/..."

[tasks."test:fhir"]
description = "Run the fhir package test suite (race + coverage)"
run = "go test -race -cover ./fhir/..."

[tasks."test:convert"]
description = "Run the convert package test suite (race + coverage)"
run = "go test -race -cover ./convert/..."

[tasks."test:fhir-gen"]
description = "Run the FHIR generator (fhir/internal) test suite (race)"
run = "go test -race ./fhir/internal/..."

[tasks."gen:fhir-r5"]
description = "Regenerate the FHIR R5 release package from the pinned definition bundle (functional from M6 Increment 1)"
dir = "fhir"
run = "go generate ./gen.go"

[tasks."gen:fhir"]
description = "Regenerate every FHIR release package from the pinned definition bundles (functional from M6 Increment 1)"
run = "go generate ./fhir/..."

[tasks."gen:verify"]
description = "Regenerate the FHIR release packages and fail on any drift from the committed tree (wired in M6 Increment 13)"
run = "go generate ./fhir/... && git diff --exit-code -- fhir/r4 fhir/r5"

[tasks."fhir:refresh-r5"]
description = "Refresh-only: re-download and re-checksum the vendored HL7 FHIR R5 definition bundle (never run at generate time)"
run = "tools/fhir-definitions/refresh.sh r5"

[tasks."test:skeleton"]
description = "Run the M2 walking-skeleton package suites (race + coverage)"
run = "go test -race -cover ./dimse/... ./dicomweb/... ./hl7v2/... ./fhir/... ./convert/... ./server/..."

[tasks."interop:dimse"]
description = "Run the DIMSE interop gate against the Orthanc/dcm4chee-arc containers"
run = "go test -tags interop -count=1 -v ./dimse/integration/..."

[tasks."interop:dicomweb"]
description = "Run the DICOMweb interop gate against the Orthanc container"
run = "go test -tags interop -count=1 -v ./dicomweb/integration/..."

[tasks."interop:convert"]
description = "Run the cross-standard convert end-to-end interop gate against the Orthanc containers"
run = "go test -tags interop -count=1 -v ./convert/..."

[tasks."dicom:dciodvfy"]
description = "Validate written DICOM files with dcmtk dciodvfy (skips if absent)"
run = "tools/dicom-conformance/dciodvfy.sh"

[tasks."dicom:pydicom"]
description = "Round-trip vendored fixtures through pydicom (skips if absent)"
run = "python3 tools/dicom-conformance/pydicom_roundtrip.py testdata/dicom"

[tasks."lint"]
description = "Run golangci-lint (2.x, Go 1.26 compatible)"
run = "golangci-lint run ./..."

[tasks."pin-drift"]
description = "Fail if any reference tool or interop image has floated back to an unpinned reference"
run = "tools/pin-drift.sh"
