[tools]
go = "1.26.4"
golangci-lint = "2.12.2"

[tasks."cover"]
description = "Run the root-module race tests and write a single merged coverage profile (coverage.out)"
# GOWORK=off scopes the run to the root module's go.mod even when the go.work workspace is present,
# so the profile and its floor reflect the library only (cmd/radx is gated by its own job).
# -coverpkg=./... puts every root-module statement in the denominator regardless of which test
# binary exercises it; -covermode=atomic is required alongside -race.
run = "GOWORK=off go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."

[tasks."cover:check"]
description = "Fail if aggregate coverage is below the PRD floor (§11.4); writes coverage.out first"
depends = ["cover"]
run = "tools/cover-check.sh coverage.out"

[tasks."test:dicom"]
description = "Run the dicom package test suite (race + coverage)"
run = "go test -race -cover ./dicom/..."

[tasks."test:dimse"]
description = "Run the dimse package test suite (race + coverage)"
run = "go test -race -cover ./dimse/..."

[tasks."test:dicomweb"]
description = "Run the dicomweb package test suite (race + coverage)"
run = "go test -race -cover ./dicomweb/..."

[tasks."test:hl7v2"]
description = "Run the hl7v2 package test suite (race + coverage)"
run = "go test -race -cover ./hl7v2/..."

[tasks."test:fhir"]
description = "Run the fhir package test suite (race + coverage)"
run = "go test -race -cover ./fhir/..."

[tasks."test:convert"]
description = "Run the convert package test suite (race + coverage)"
run = "go test -race -cover ./convert/..."

[tasks."test:fhir-gen"]
description = "Run the FHIR generator (fhir/internal) test suite (race)"
run = "go test -race ./fhir/internal/..."

[tasks."gen:fhir-r5"]
description = "Regenerate the FHIR R5 release package from the pinned definition bundle (functional from M6 Increment 1)"
dir = "fhir"
run = "go generate ./gen.go"

[tasks."gen:fhir"]
description = "Regenerate every FHIR release package from the pinned definition bundles (functional from M6 Increment 1)"
run = "go generate ./fhir/..."

[tasks."gen:verify"]
description = "Regenerate the FHIR release packages and fail on any drift from the committed tree"
# The byte-for-byte regeneration test is the authoritative gate: it regenerates into a temp dir
# and diffs against the committed files, so a hand edit or an un-regenerated generator change fails
# with a precise message and without depending on git staging. The trailing git diff catches the
# rarer case where the committed tree itself was edited and committed.
run = "go test ./fhir/internal/gen/ -run TestRegenerationByteForByte && go generate ./fhir/... && git diff --exit-code -- fhir/r4 fhir/r5"

[tasks."fhir:refresh-r5"]
description = "Refresh-only: re-download and re-checksum the vendored HL7 FHIR R5 definition bundle (never run at generate time)"
run = "tools/fhir-definitions/refresh.sh r5"

[tasks."test:skeleton"]
description = "Run the M2 walking-skeleton package suites (race + coverage)"
run = "go test -race -cover ./dimse/... ./dicomweb/... ./hl7v2/... ./fhir/... ./convert/... ./server/..."

[tasks."interop:dimse"]
description = "Run the DIMSE interop gate against the Orthanc/dcm4chee-arc containers"
run = "go test -tags interop -count=1 -v ./dimse/integration/..."

[tasks."interop:dicomweb"]
description = "Run the DICOMweb interop gate against the Orthanc container"
run = "go test -tags interop -count=1 -v ./dicomweb/integration/..."

[tasks."interop:convert"]
description = "Run the cross-standard convert end-to-end interop gate against the Orthanc containers"
run = "go test -tags interop -count=1 -v ./convert/..."

[tasks."dicom:dciodvfy"]
description = "Validate written DICOM files with dcmtk dciodvfy (skips if absent)"
run = "tools/dicom-conformance/dciodvfy.sh"

[tasks."dicom:pydicom"]
description = "Round-trip vendored fixtures through pydicom (skips if absent)"
run = "python3 tools/dicom-conformance/pydicom_roundtrip.py testdata/dicom"

[tasks."conformance:fhir"]
description = "Validate the go-radx FHIR R5 workflow set with the pinned HL7 FHIR validator (skips if Java/jar absent; the negative fixture must be rejected)"
run = "tools/fhir-conformance/validate.sh"

[tasks."lint"]
description = "Run golangci-lint (2.x, Go 1.26 compatible)"
run = "golangci-lint run ./..."

[tasks."pin-drift"]
description = "Fail if any reference tool or interop image has floated back to an unpinned reference"
run = "tools/pin-drift.sh"

[tasks."conformance-drift"]
description = "Fail if a conformance statement and the code it describes diverge (counts, banners, stability markers)"
run = "go test ./tools/conformance-drift/..."

[tasks."phi-sweep"]
description = "Run the PHI-default log sweep: fail if a patient identifier reaches a sink under default config"
# Scopes to the root module; the sweep uses synthetic sentinels only, never real PHI.
run = "GOWORK=off go test ./internal/phisweep/..."

[tasks."fuzz"]
description = "Bounded fuzz smoke over every target (one target per invocation, anchored regex, hang = failure)"
# A go-test fuzz run takes ONE target per invocation, so each target is listed with an anchored
# ^Name$ regex to run exactly that target. Each is wrapped in coreutils `timeout` at a wall-clock
# budget above -fuzztime, so a target that wedges exits non-zero — a hang is a FAILURE, never a skip.
# Requires `timeout` on PATH (present on Linux runners; macOS provides it as `gtimeout` via
# coreutils). FUZZTIME overrides the per-target budget locally (e.g. FUZZTIME=5s mise run fuzz).
# bash -c, not the default sh: on Ubuntu /bin/sh is dash, which rejects `set -o pipefail`.
shell = "bash -c"
run = """
set -euo pipefail
fuzztime="${FUZZTIME:-30s}"
run_one() {
  echo "fuzz: $2 ($1) for $fuzztime"
  timeout 120s go test -run='^$' -fuzz="$2" -fuzztime="$fuzztime" "$1"
}
run_one ./dicom '^FuzzRead$'
run_one ./dicom '^FuzzReadPixelDataFrom$'
run_one ./dimse/pdu '^FuzzReadPDU$'
run_one ./dimse/pdu '^FuzzDecodeAssociateAC$'
run_one ./dimse/pdu '^FuzzDecodePDV$'
"""

[tasks."bench"]
description = "Run the dicom benchmarks once (-benchtime=1x) so the benchmark code and baselines cannot rot"
# -run='^$' selects no unit tests so only benchmarks run; the pure-Go default build excludes the
# cgo-tagged codec benchmarks (covered by the codecs job). Scoped to the root module.
run = "GOWORK=off go test -bench=. -benchtime=1x -run='^$' ./dicom/..."

[tasks."docs:build"]
# Requires mkdocs + mkdocs-material on PATH (pip install mkdocs mkdocs-material). The CI job that
# provisions this toolchain is wired by the gate-enforcement work; until then this is a local task.
description = "Build the mkdocs documentation site, failing on any nav drift (--strict)"
run = "mkdocs build --strict"

[tasks."docs:serve"]
# Requires mkdocs + mkdocs-material on PATH (see docs:build).
description = "Preview the mkdocs documentation site locally with live reload"
run = "mkdocs serve"
