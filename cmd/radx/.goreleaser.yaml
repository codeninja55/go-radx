# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser configuration for the `radx` command-line interface.
#
# go-radx is primarily a Go LIBRARY consumed via `go get` and the module proxy: its versioning is
# git tags plus semver, not a binary release. The only binary artifact is the `radx` CLI, which
# lives in its own Go module here at cmd/radx (own go.mod, `replace github.com/codeninja55/go-radx
# => ../..`). This config therefore lives beside that module and is invoked from this directory, so
# `main: .` resolves to the CLI module and the replace directive compiles the in-tree library beside
# it — exactly what the `cmd-radx` CI job does with GOWORK=off.
#
# Verified-build proxy mode (gomod.proxy) is deliberately OFF: a `replace` to a local path cannot be
# resolved through proxy.golang.org, so proxy mode would break the build. The build is still
# reproducible (-trimpath, mod_timestamp pinned to the commit, the pinned Go toolchain), just not
# proxy-verified. GOWORK=off in the build env scopes the compile to cmd/radx/go.mod even when the
# repository's go.work workspace is present, mirroring the CI invariant.
version: 2

project_name: radx

before:
  hooks:
    # Resolve the module graph for the CLI module (and the replaced in-tree library) before the
    # matrix build starts, so a network hiccup fails one fast step rather than each parallel build.
    - go mod download

builds:
  - id: radx
    main: .
    binary: radx
    env:
      - CGO_ENABLED=0
      # Scope the build to cmd/radx/go.mod; the `replace ../..` then compiles the library source in
      # the repository, never a stale module-cache copy. Matches the cmd-radx CI job.
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    # Inject the build stamp the CLI's `--version` flag prints. The variables live in
    # cmd/radx/internal/cli (version, commit, date); ResolveBuildInfo prefers these ldflags
    # overrides and falls back to the embedded VCS stamp for a plain `go build`.
    ldflags:
      - -s -w
      - -X github.com/codeninja55/go-radx/cmd/radx/internal/cli.version={{ .Version }}
      - -X github.com/codeninja55/go-radx/cmd/radx/internal/cli.commit={{ .Commit }}
      - -X github.com/codeninja55/go-radx/cmd/radx/internal/cli.date={{ .CommitDate }}

archives:
  - id: radx
    ids:
      - radx
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows users expect a .zip; everything else gets a .tar.gz (the default).
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The archive carries the radx binary only. GoReleaser runs from cmd/radx and resolves archive
    # `files` globs against a static prefix that cannot traverse out of the working directory with
    # `../`, so the repository-root LICENSE and READMEs are not bundled here; they live in the
    # repository and are linked from the release notes. The license is MIT (see LICENSE at the root).

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Software Bill of Materials per archive, generated by syft. goreleaser only allows one output
# document per SBOM entry when artifacts="archive", so emit two entries over the same archives: one
# CycloneDX rendering and one SPDX rendering of the same catalogue, so a consumer can ingest either
# format. syft must be on PATH (the release workflow installs it; goreleaser shells out to it).
sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=${document}"
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=${document}"

# Keyless signing of the checksums file with cosign over OIDC. The release workflow grants
# `id-token: write`, so cosign mints a short-lived Fulcio certificate from the GitHub Actions OIDC
# token — no long-lived private key is stored anywhere. Signing the checksums file transitively
# covers every archive, since each archive's digest is recorded in the checksums file.
#
# cosign v3 (installed by sigstore/cosign-installer@v3) replaced the v2 two-file output
# (--output-certificate / --output-signature) with a single Sigstore bundle: `sign-blob --bundle`
# writes one `${artifact}.sigstore.json` carrying both the certificate and the signature, verified
# with `cosign verify-blob --bundle ...`. See https://goreleaser.com/blog/cosign-v3/. `--yes` keeps
# keyless signing non-interactive; keyless is the default in cosign v3, so no COSIGN_EXPERIMENTAL.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  # Snapshot builds (the PR/push validation job) are not real releases; tag them with a -devel
  # suffix so they can never be mistaken for a published version.
  version_template: "{{ incpatch .Version }}-devel-{{ .ShortCommit }}"

changelog:
  # The CHANGELOG.md at the repository root is hand-maintained (Keep a Changelog), so do not let
  # goreleaser synthesize a commit-derived changelog that would compete with it.
  disable: true

release:
  github:
    owner: codeninja55
    name: go-radx
  # Mark every release a draft so a human reviews the artifacts, the SBOMs, and the signatures
  # before they go public. While the project is pre-1.0, mark it a prerelease automatically.
  draft: true
  prerelease: auto
  name_template: "radx {{ .Version }}"
  header: |
    ## radx {{ .Version }}

    The `radx` command-line interface for go-radx. go-radx is a Go library (consumed as a module);
    this release is its CLI binary. The library itself is licensed MIT (see the repository LICENSE).

    Verify the download against `{{ .ProjectName }}_{{ .Version }}_checksums.txt` and the cosign
    Sigstore bundle (`{{ .ProjectName }}_{{ .Version }}_checksums.txt.sigstore.json`) with
    `cosign verify-blob --bundle`. An SBOM (CycloneDX and SPDX) accompanies each archive, and the
    archives, checksums, and SBOMs carry SLSA build-provenance attestations.
