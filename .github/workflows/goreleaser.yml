name: GoReleaser

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout specific tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --force --tags
          git checkout ${{ github.event.inputs.tag }}

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          version: 2025.11.5
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CGO dependencies
        run: mise deps:install

      - name: Run GoReleaser with goreleaser-cross
        run: |
          docker run --rm \
            -e CGO_ENABLED=1 \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GORELEASER_CURRENT_TAG="${{ github.event.inputs.tag || github.ref_name }}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace \
            -w /workspace \
            ghcr.io/goreleaser/goreleaser-cross:latest \
            release --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 7
