# CI for the go-radx re-foundation.
#
# Design: the default build is pure-Go (CGO_ENABLED=0); the C-backed pixel codecs live behind the
# dicom_openjpeg / dicom_libjpeg / dicom_charls build tags, so only the `codecs` job needs the native
# libraries (built from source, since Ubuntu apt ships older versions than the codecs require). The
# conformance gate (tools/dicom-conformance) skips on a dev box but FAILS when CI=true, so this is
# where it runs for real — validating go-radx's writer output, not the borrowed fixture corpus.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt Node20-based actions (jdx/mise-action) into the Node24 runtime ahead of the forced migration,
# silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    name: Lint, vet, build, race tests (pure-Go default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 + golangci-lint 2.12.2 per mise.toml [tools]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: pin-drift (reference tools + interop images pinned)
        # Fails if a reference tool or interop image floated back to an unpinned reference (a
        # `:latest` image tag, an `@latest` install, or an unpinned pip/apt install). Pins of record
        # live in tools/versions.
        run: mise run pin-drift
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (default build)
        run: mise exec -- golangci-lint run ./...
      - name: golangci-lint (interop build tag)
        run: mise exec -- golangci-lint run --build-tags interop ./...
      - name: build
        run: go build ./...
      - name: race tests + coverage floor (default build; race needs cgo but no codec libs)
        # This is the STANDING -race gate (docs/conformance/cross-cutting.md §"Concurrency and race
        # posture"): every library test run is a race-detector run. cover:check runs the root-module
        # suite as a single `go test -race -covermode=atomic -coverpkg=./... ./...` (writing one
        # merged coverage profile), then fails the step if aggregate statement coverage drops below
        # the PRD floor (§11.4). cover:check depends on cover, so the profile is produced before the
        # floor is checked. -race must be preserved here (atomic is the cover mode -race requires);
        # do not drop it to speed the step up. The codecs job intentionally runs without -race — see
        # the cross-cutting posture for why the race gate is the pure-Go gate.
        run: mise run cover:check

  conformance:
    name: DICOM conformance (dciodvfy + pydicom, enforced)
    runs-on: ubuntu-latest
    env:
      CI: "true" # flips tools/dicom-conformance/*.sh from skip-locally to fail-if-tool-absent
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dicom3tools (provides dciodvfy) + pydicom
        run: |
          # dciodvfy is a David Clunie dicom3tools program (Ubuntu universe), NOT a dcmtk tool —
          # dcmtk ships no IOD validator. The first CI run installed dcmtk and the gate correctly
          # failed because dciodvfy was absent.
          #
          # Both reference tools are version-pinned so the conformance result is reproducible rather
          # than dependent on whatever the runner resolves at install time:
          #   * dicom3tools is pinned to the exact Ubuntu (noble) archive version. apt has no
          #     point-in-time snapshot here, so if the runner image rolls the package forward this
          #     install fails loudly — that is the intended signal to re-pin deliberately, not a
          #     silent float. Re-resolve with `apt-cache policy dicom3tools` and bump the version
          #     here together with the pin noted in docs/conformance/cross-cutting.md.
          #   * pydicom is pinned to an exact PyPI release; 3.x is required because the round-trip
          #     gate uses save_as(enforce_file_format=...), a pydicom 3.0 API.
          sudo apt-get update
          sudo apt-get install -y python3-pip 'dicom3tools=1.00~20240118131615-1'
          python3 -m pip install --break-system-packages 'pydicom==3.0.2'
      - name: DICOM IOD validation (dciodvfy)
        run: mise run dicom:dciodvfy
      - name: pydicom round-trip
        run: mise run dicom:pydicom

  interop:
    name: Interop gate (${{ matrix.leg }} — testcontainers)
    runs-on: ubuntu-latest
    strategy:
      # Run each interop leg on its own runner rather than serially on one. The legs all
      # drive containers; isolating them keeps the memory-heavy DIMSE dcm4chee-arc stack
      # (LDAP + PostgreSQL + WildFly) off the same runner as the Orthanc-only DICOMweb and
      # convert legs, and fail-fast: false reports every leg even when one fails.
      fail-fast: false
      matrix:
        # Each leg names the mise task that runs it, so CI and `mise run interop:*` stay in
        # agreement. dimse is the C-STORE/C-FIND/C-GET/C-MOVE net against Orthanc + dcm4chee-arc;
        # dicomweb is the STOW/WADO round-trip against Orthanc; convert is the cross-standard
        # walking-skeleton end-to-end proof, whose DIMSE and DICOMweb legs run against Orthanc.
        leg: [dimse, dicomweb, convert]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ matrix.leg }} interop tests
        # GitHub-hosted ubuntu runners ship Docker; testcontainers manages the Orthanc and
        # dcm4chee-arc stacks behind the pinned image digests. The dcm4chee-arc stack the dimse
        # leg starts is memory-heavy for a standard runner — watch that leg if the runner is
        # resource-constrained.
        run: mise run interop:${{ matrix.leg }}

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - name: Install govulncheck
        # Pin the scanner to a released version so its analysis behaviour is fixed; @latest would
        # let the scanner float between runs. The vulnerability database stays live (vuln.go.dev),
        # so a newly disclosed advisory still fails the gate.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck
        run: govulncheck ./...

  cmd-radx:
    # The radx CLI lives in its own module (cmd/radx) so library consumers do not inherit the CLI's
    # dependency graph. The root go.work ties the two modules for local development, but the library
    # jobs above scope to the root module (the `./...` pattern stops at the nested module boundary),
    # so without this job cmd/radx would never be built, vetted, or scanned in CI. GOWORK=off makes
    # each step resolve against cmd/radx's own go.mod/go.sum — the module is gated exactly as a
    # downstream consumer building the CLI would see it, not as a workspace shortcut.
    name: cmd/radx module (build, vet, lint, vuln scan)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: cmd/radx
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 + golangci-lint 2.12.2 per mise.toml [tools]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: mise exec -- golangci-lint run ./...
      - name: govulncheck
        # Pinned to the same released version as the root govulncheck job so both modules are scanned
        # by an analysis tool whose behaviour is fixed run to run; the vulnerability database stays
        # live. `go run …@v1.3.0` resolves the pinned scanner directly under the mise-provided Go,
        # avoiding a PATH dependency on where `go install` would drop the binary.
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  codecs:
    # The C-backed pixel codecs are pinned to OpenJPEG 2.5.4, libjpeg-turbo 3.1.4, and CharLS 2.4.3
    # (the versions the local build links via Homebrew). Ubuntu apt ships older releases — notably
    # libjpeg-turbo 2.x, which lacks the TJPARAM_LOSSLESS API codec_libjpeg.go uses — so the
    # libraries are built from source here.
    name: CGo pixel codecs (native libs from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config nasm curl
      - name: Build & install OpenJPEG 2.5.4
        run: |
          curl -fsSL https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz | tar -xz
          cmake -S openjpeg-2.5.4 -B openjpeg-2.5.4/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build openjpeg-2.5.4/build -j"$(nproc)"
          sudo cmake --install openjpeg-2.5.4/build
      - name: Build & install libjpeg-turbo 3.1.4
        run: |
          curl -fsSL https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4/libjpeg-turbo-3.1.4.tar.gz | tar -xz
          # libjpeg-turbo's cmake defaults CMAKE_INSTALL_PREFIX to /opt/libjpeg-turbo (unlike OpenJPEG
          # and CharLS, which default to /usr/local) — pin it so libturbojpeg.pc lands where the
          # others do and pkg-config discovery finds it.
          cmake -S libjpeg-turbo-3.1.4 -B libjpeg-turbo-3.1.4/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build libjpeg-turbo-3.1.4/build -j"$(nproc)"
          sudo cmake --install libjpeg-turbo-3.1.4/build
      - name: Build & install CharLS 2.4.3
        run: |
          curl -fsSL https://github.com/team-charls/charls/archive/refs/tags/2.4.3.tar.gz | tar -xz
          cmake -S charls-2.4.3 -B charls-2.4.3/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build charls-2.4.3/build -j"$(nproc)"
          sudo cmake --install charls-2.4.3/build
      - name: Refresh linker cache
        run: sudo ldconfig
      # Discover where each from-source cmake installed its .pc and .so files under /usr/local and
      # export them for the build/test/lint steps, instead of hardcoding a libdir that the three libs
      # disagree on (lib vs lib64 vs a multiarch dir).
      - name: Resolve pkg-config and linker paths
        run: |
          pc="$(find /usr/local -type d -name pkgconfig 2>/dev/null | sort -u | paste -sd: -)"
          libs="$(find /usr/local -type f -name 'lib*.so*' -printf '%h\n' 2>/dev/null | sort -u | paste -sd: -)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libs" >> "$GITHUB_ENV"
      # Split into three steps so the job summary pinpoints which fails on Linux (the combined
      # step passes locally on macOS): the cgo build/link, the codec tests, or the tagged lint.
      - name: Build with codec tags
        run: go build -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
      - name: Test with codec tags
        run: go test -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./dicom/...
      - name: Lint with codec tags
        run: mise exec -- golangci-lint run --build-tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
