# CI for the go-radx re-foundation.
#
# Design: the default build is pure-Go (CGO_ENABLED=0); the C-backed pixel codecs live behind the
# dicom_openjpeg / dicom_libjpeg / dicom_charls build tags, so only the `codecs` job needs the native
# libraries (built from source, since Ubuntu apt ships older versions than the codecs require). The
# conformance gate (tools/dicom-conformance) skips on a dev box but FAILS when CI=true, so this is
# where it runs for real — validating go-radx's writer output, not the borrowed fixture corpus.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt Node20-based actions (jdx/mise-action) into the Node24 runtime ahead of the forced migration,
# silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    name: Lint, vet, build, race tests (pure-Go default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 + golangci-lint 2.12.2 per mise.toml [tools]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin the Go module and build caches to fixed runner-temp paths (OFF the checked-out workspace,
      # so gofmt/lint do not descend into third-party module sources) before any go command runs. This
      # must be a step, not a job-level env: the `runner` context is invalid in an env block and using
      # it there fails the whole workflow at parse time. The shell var $RUNNER_TEMP (always set in a
      # step) stands in for ${{ runner.temp }} here; the actions/cache step below restores to the same
      # paths via ${{ runner.temp }}, which IS valid in a step's with:.
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      # Cache the Go module downloads (GOMODCACHE) and compiled build output (GOCACHE). The key
      # embeds the Go version (a toolchain bump must not reuse objects built by the old compiler) and
      # go.sum (a dependency change re-resolves the module cache); restore-keys lets an unchanged Go
      # version reuse a near-match cache and top it up. Scoped to the root module's go.sum.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: pin-drift (reference tools + interop images pinned)
        # Fails if a reference tool or interop image floated back to an unpinned reference (a
        # `:latest` image tag, an `@latest` install, or an unpinned pip/apt install). Pins of record
        # live in tools/versions.
        run: mise run pin-drift
      - name: FHIR definition bundle checksums (vendored R4 + R5)
        # The vendored HL7 FHIR definition bundles are checksum-pinned reference data: the bytes on
        # disk must match the committed SHA256SUMS, because the generator's loader verifies the
        # SHA-256 fail-closed before parsing. The loader tests exercise that path, but this standalone
        # step makes a drifted or corrupted bundle a hard CI error on its own, independent of the Go
        # suite, and names the offending file directly.
        run: |
          set -e
          for rel in r4 r5; do
            dir="fhir/internal/gen/testdata/definitions/${rel}"
            echo "Verifying ${dir}/SHA256SUMS ..."
            (cd "$dir" && shasum -a 256 -c SHA256SUMS)
          done
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (default build)
        run: mise exec -- golangci-lint run ./...
      - name: golangci-lint (interop build tag)
        run: mise exec -- golangci-lint run --build-tags interop ./...
      - name: build
        run: go build ./...
      - name: race tests + coverage floor (default build; race needs cgo but no codec libs)
        # This is the STANDING -race gate (docs/conformance/cross-cutting.md §"Concurrency and race
        # posture"): the pure-Go default unit-test build runs under the race detector on every change.
        # cover:check runs the root-module suite as a single
        # `go test -race -covermode=atomic -coverpkg=./... ./...` (writing one merged coverage
        # profile), then fails the step if aggregate statement coverage drops below the PRD floor
        # (§11.4). cover:check depends on cover, so the profile is produced before the floor is
        # checked. -race must be preserved here (atomic is the cover mode -race requires); do not drop
        # it to speed the step up. The codecs and interop jobs intentionally run without -race — see
        # the cross-cutting posture for why the race gate is the pure-Go unit-test gate.
        run: mise run cover:check
      - name: critical-path coverage gate (90% on the untrusted-input + conversion core)
        # On top of the module-wide 80% floor, enforce a per-package 90% target on the critical
        # paths — the parsers, codecs, transport, and conversion core (docs/conformance/cross-cutting.md
        # "Coverage targets and critical-path enumeration"). cover-check.sh above already ran `cover`,
        # which wrote coverage.out; this step reuses that same merged race profile rather than running
        # a second race suite. It FAILS if an ENFORCED critical-path package drops below 90% or a
        # RATCHET (TODO-toward-90%) package regresses below its recorded baseline. The set that
        # enforces 90% today vs. the documented TODO is recorded in tools/cover-critical.sh and
        # cross-cutting.md.
        run: tools/cover-critical.sh coverage.out

  conformance:
    name: DICOM conformance (dciodvfy + pydicom, enforced)
    runs-on: ubuntu-latest
    env:
      CI: "true" # flips tools/dicom-conformance/*.sh from skip-locally to fail-if-tool-absent
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Install dicom3tools (provides dciodvfy) + pydicom
        run: |
          # dciodvfy is a David Clunie dicom3tools program (Ubuntu universe), NOT a dcmtk tool —
          # dcmtk ships no IOD validator. The first CI run installed dcmtk and the gate correctly
          # failed because dciodvfy was absent.
          #
          # Both reference tools are version-pinned so the conformance result is reproducible rather
          # than dependent on whatever the runner resolves at install time:
          #   * dicom3tools is pinned to the exact Ubuntu (noble) archive version. apt has no
          #     point-in-time snapshot here, so if the runner image rolls the package forward this
          #     install fails loudly — that is the intended signal to re-pin deliberately, not a
          #     silent float. Re-resolve with `apt-cache policy dicom3tools` and bump the version
          #     here together with the pin noted in docs/conformance/cross-cutting.md.
          #   * pydicom is pinned to an exact PyPI release; 3.x is required because the round-trip
          #     gate uses save_as(enforce_file_format=...), a pydicom 3.0 API.
          sudo apt-get update
          sudo apt-get install -y python3-pip 'dicom3tools=1.00~20240118131615-1'
          python3 -m pip install --break-system-packages 'pydicom==3.0.2'
      - name: DICOM IOD validation (dciodvfy)
        run: mise run dicom:dciodvfy
      - name: pydicom round-trip
        run: mise run dicom:pydicom

  fhir-conformance:
    name: FHIR R4 + R5 conformance (HL7 validator, merge-blocking)
    runs-on: ubuntu-latest
    env:
      CI: "true" # flips tools/fhir-conformance/validate.sh from skip-locally to fail-if-absent
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 per mise.toml [tools]; the gate runs `go run` for the fixtures
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Install JDK 17 (the HL7 validator_cli.jar runs on the JDK)
        # The validator is the official HL7 validator_cli.jar (NOT a container) — the M6a
        # mechanism decision recorded in tools/versions. It is pinned by version AND SHA-256
        # there; tools/fhir-conformance/validate.sh downloads exactly that release asset and
        # verifies the checksum before running it, so the conformance result is reproducible
        # rather than dependent on whatever the runner resolves at install time.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: FHIR R4 + R5 conformance gate (workflow set + negative fixture)
        # Marshals the go-radx-generated workflow set, validates it against R5 5.0.0 with the
        # pinned validator (zero errors required), and asserts the deliberately-invalid
        # negative fixture is REJECTED so the gate is proven to bite.
        run: mise run conformance:fhir

  interop:
    name: Interop gate (${{ matrix.leg }} — testcontainers)
    runs-on: ubuntu-latest
    strategy:
      # Run each interop leg on its own runner rather than serially on one. The legs all
      # drive containers; isolating them keeps the memory-heavy DIMSE dcm4chee-arc stack
      # (LDAP + PostgreSQL + WildFly) off the same runner as the Orthanc-only DICOMweb and
      # convert legs, and fail-fast: false reports every leg even when one fails.
      fail-fast: false
      matrix:
        # Each leg names the mise task that runs it, so CI and `mise run interop:*` stay in
        # agreement. dimse is the C-STORE/C-FIND/C-GET/C-MOVE net against Orthanc + dcm4chee-arc;
        # dicomweb is the STOW/WADO round-trip against Orthanc; convert is the cross-standard
        # walking-skeleton end-to-end proof, whose DIMSE and DICOMweb legs run against Orthanc.
        leg: [dimse, dicomweb, convert]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      # Per-leg cache scope: the legs run concurrently, so a shared key would race on the cache write.
      # The `interop` build-tag objects differ from the default build, so this scope is kept distinct
      # from the root cache rather than competing with it.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-interop-${{ matrix.leg }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-interop-${{ matrix.leg }}-
      - name: ${{ matrix.leg }} interop tests
        # GitHub-hosted ubuntu runners ship Docker; testcontainers manages the Orthanc and
        # dcm4chee-arc stacks behind the pinned image digests. The dcm4chee-arc stack the dimse
        # leg starts is memory-heavy for a standard runner — watch that leg if the runner is
        # resource-constrained.
        run: mise run interop:${{ matrix.leg }}

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          # setup-go caches GOMODCACHE + GOCACHE keyed on the Go version and the named go.sum; scope
          # it to the root module so the scan of ./... reuses the module download and build objects.
          cache: true
          cache-dependency-path: go.sum
      - name: Install govulncheck
        # Pin the scanner to a released version so its analysis behaviour is fixed; @latest would
        # let the scanner float between runs. The vulnerability database stays live (vuln.go.dev),
        # so a newly disclosed advisory still fails the gate.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck
        run: govulncheck ./...

  cmd-radx:
    # The radx CLI lives in its own module (cmd/radx) so library consumers do not inherit the CLI's
    # dependency graph. The root go.work ties the two modules for local development, but the library
    # jobs above scope to the root module (the `./...` pattern stops at the nested module boundary),
    # so without this job cmd/radx would never be built, vetted, or scanned in CI. GOWORK=off makes
    # each step resolve against cmd/radx's own go.mod/go.sum — the module is gated exactly as a
    # downstream consumer building the CLI would see it, not as a workspace shortcut.
    name: cmd/radx module (build, vet, lint, vuln scan)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: cmd/radx
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 + golangci-lint 2.12.2 per mise.toml [tools]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin the Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      # Absolute $RUNNER_TEMP paths resolve identically regardless of the cmd/radx working-directory.
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      # Scoped to cmd/radx's own go.sum (the module is gated as a downstream consumer would build it).
      # hashFiles and the cache path are workspace-relative, unaffected by the working-directory above.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-cmd-radx-${{ hashFiles('cmd/radx/go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-cmd-radx-
      - name: build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        # The cmd/radx module is gofmt-clean on its own, scoped to this working-directory so
        # the check is independent of the root module's gofmt step.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These cmd/radx files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: race tests
        # The CLI's own race gate: the exit-code totality test, the output-contract test, and
        # the echo/dump golden-output tests run under the race detector against the in-tree
        # library (GOWORK=off resolves the replace to ../..). echo's in-process SCP test server
        # exercises a concurrent association, so -race must be preserved here.
        run: go test -race ./...
      - name: golangci-lint
        run: mise exec -- golangci-lint run ./...
      - name: radx --version smoke
        # Confirm the wired binary runs and prints a coherent build line: --version exits 0 and
        # emits a non-empty "radx <version> ..." string. This catches a binary that builds but
        # cannot start (a broken Kong grammar or version-var wiring) before it ships.
        run: |
          go build -o /tmp/radx .
          out="$(/tmp/radx --version 2>&1)"
          echo "$out"
          case "$out" in
            radx\ *) echo "radx --version OK" ;;
            *) echo "radx --version did not print a coherent build line" >&2; exit 1 ;;
          esac
      - name: govulncheck
        # Pinned to the same released version as the root govulncheck job so both modules are scanned
        # by an analysis tool whose behaviour is fixed run to run; the vulnerability database stays
        # live. `go run …@v1.3.0` resolves the pinned scanner directly under the mise-provided Go,
        # avoiding a PATH dependency on where `go install` would drop the binary.
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  codecs:
    # The C-backed pixel codecs are pinned to OpenJPEG 2.5.4, libjpeg-turbo 3.1.4, and CharLS 2.4.3
    # (the versions the local build links via Homebrew). Ubuntu apt ships older releases — notably
    # libjpeg-turbo 2.x, which lacks the TJPARAM_LOSSLESS API codec_libjpeg.go uses — so the
    # libraries are built from source here.
    name: CGo pixel codecs (native libs from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      # The codec build/test compiles cgo-tagged objects distinct from the default build, so this is a
      # separate cache scope from the root job rather than competing with it.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-codecs-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-codecs-
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config nasm curl
      # Cache the downloaded codec source tarballs keyed on the pinned versions (tools/versions). The
      # download steps below restore from this cache on a hit and skip the network entirely, so a
      # mirror 502/504 hiccup is retryable across runs instead of failing the job — and the checksum
      # verification still runs against the restored bytes, so a poisoned cache cannot reach the build.
      # The key embeds every pinned version so a version bump misses the old cache and re-downloads.
      - name: Cache codec source tarballs
        uses: actions/cache@v4
        with:
          path: codec-src
          key: codec-src-openjpeg-2.5.4-libjpeg-turbo-3.1.4-charls-2.4.3
      - name: Build & install OpenJPEG 2.5.4
        env:
          # SHA-256 of the GitHub source archive, pinned in tools/versions (codec.openjpeg.sha256).
          OPENJPEG_SHA256: a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a
        run: |
          mkdir -p codec-src
          tarball=codec-src/openjpeg-2.5.4.tar.gz
          # Download only on a cache miss; --retry rides out a transient mirror 5xx. Verify the
          # SHA-256 fail-closed BEFORE extraction — a checksum mismatch (tamper or truncation) aborts
          # the job rather than feeding unverified bytes to the build.
          if [ ! -f "$tarball" ]; then
            curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
              https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz
          fi
          echo "${OPENJPEG_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          cmake -S openjpeg-2.5.4 -B openjpeg-2.5.4/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build openjpeg-2.5.4/build -j"$(nproc)"
          sudo cmake --install openjpeg-2.5.4/build
      - name: Build & install libjpeg-turbo 3.1.4
        env:
          # SHA-256 of the GitHub release asset, pinned in tools/versions (codec.libjpeg-turbo.sha256).
          LIBJPEG_TURBO_SHA256: e23d3ebb2c6ee4d0e2a5823dbb55b614845df5ea3435c956fed5cf04041a87ad
        run: |
          mkdir -p codec-src
          tarball=codec-src/libjpeg-turbo-3.1.4.tar.gz
          if [ ! -f "$tarball" ]; then
            curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
              https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4/libjpeg-turbo-3.1.4.tar.gz
          fi
          echo "${LIBJPEG_TURBO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          # libjpeg-turbo's cmake defaults CMAKE_INSTALL_PREFIX to /opt/libjpeg-turbo (unlike OpenJPEG
          # and CharLS, which default to /usr/local) — pin it so libturbojpeg.pc lands where the
          # others do and pkg-config discovery finds it.
          cmake -S libjpeg-turbo-3.1.4 -B libjpeg-turbo-3.1.4/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build libjpeg-turbo-3.1.4/build -j"$(nproc)"
          sudo cmake --install libjpeg-turbo-3.1.4/build
      - name: Build & install CharLS 2.4.3
        env:
          # SHA-256 of the GitHub source archive, pinned in tools/versions (codec.charls.sha256).
          CHARLS_SHA256: bbf67d51446a98eb8fc98c9c6de49a2605c709d3a14ba39f09a09f8e57527099
        run: |
          mkdir -p codec-src
          tarball=codec-src/charls-2.4.3.tar.gz
          if [ ! -f "$tarball" ]; then
            curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
              https://github.com/team-charls/charls/archive/refs/tags/2.4.3.tar.gz
          fi
          echo "${CHARLS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          cmake -S charls-2.4.3 -B charls-2.4.3/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build charls-2.4.3/build -j"$(nproc)"
          sudo cmake --install charls-2.4.3/build
      - name: Refresh linker cache
        run: sudo ldconfig
      # Discover where each from-source cmake installed its .pc and .so files under /usr/local and
      # export them for the build/test/lint steps, instead of hardcoding a libdir that the three libs
      # disagree on (lib vs lib64 vs a multiarch dir).
      - name: Resolve pkg-config and linker paths
        run: |
          pc="$(find /usr/local -type d -name pkgconfig 2>/dev/null | sort -u | paste -sd: -)"
          libs="$(find /usr/local -type f -name 'lib*.so*' -printf '%h\n' 2>/dev/null | sort -u | paste -sd: -)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libs" >> "$GITHUB_ENV"
      # Split into three steps so the job summary pinpoints which fails on Linux (the combined
      # step passes locally on macOS): the cgo build/link, the codec tests, or the tagged lint.
      - name: Build with codec tags
        run: go build -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
      - name: Test with codec tags
        run: go test -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./dicom/...
      - name: Lint with codec tags
        run: mise exec -- golangci-lint run --build-tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
      # Race pass over the codec entry points, using the clean Release-built libs above (BEFORE the
      # ASAN rebuild — the race runtime and the ASAN runtime both intercept allocation, so they are
      # never combined in one binary). The codec transcoders are synchronous per-call functions today,
      # so this is a guard that a future concurrent codec path (a worker pool, shared mutable state)
      # cannot land a Go data race unnoticed; the hostile-input subprocess harness also exercises the
      # decode path under it. This is the codec-scoped complement to the pure-Go standing race gate.
      - name: Race pass over codec packages
        run: go test -race -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./dicom/...
      # Clang is the compiler for the whole ASAN/UBSan pass (the rebuild below and the `go test -asan`
      # step). ubuntu-latest defaults cgo/cmake to GCC, and GCC rejects `-shared-libasan` (it links
      # libasan statically and has no such flag), so a GCC configure fails before any sanitizer runs.
      # Clang accepts `-shared-libasan`, which lets the instrumented C libraries and `go test -asan`
      # (which preloads its own ASAN runtime) share ONE shared ASAN runtime instead of fighting two
      # static copies. clang/clang++ are preinstalled on ubuntu-latest; install fail-safe in case the
      # image drops them.
      - name: Install clang for the ASAN pass
        run: sudo apt-get install -y clang
      # Rebuild the three codec libraries from the cached, already-verified source with AddressSanitizer
      # + UndefinedBehaviorSanitizer instrumentation, installed over the Release libs (this runs after
      # the Release build/test/lint and the race pass, which used the clean libs). CC/CXX force clang so
      # -shared-libasan is accepted (see the install step). -shared-libasan links the shared ASAN runtime
      # so `go test -asan` and the instrumented C libraries agree on one runtime. -fno-omit-frame-pointer
      # keeps the C stack legible in any report. The source is already extracted and SHA-256-verified by
      # the build steps above, so this only recompiles.
      - name: Rebuild codec libs with ASAN + UBSan
        env:
          CC: clang
          CXX: clang++
          SAN_FLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -shared-libasan"
        run: |
          set -e
          for d in openjpeg-2.5.4 libjpeg-turbo-3.1.4 charls-2.4.3; do
            extra=""
            # libjpeg-turbo uses ENABLE_SHARED rather than BUILD_SHARED_LIBS and a non-default prefix.
            case "$d" in
              libjpeg-turbo-*) extra="-DENABLE_SHARED=ON -DCMAKE_INSTALL_PREFIX=/usr/local" ;;
              *)               extra="-DBUILD_SHARED_LIBS=ON" ;;
            esac
            cmake -S "$d" -B "$d/build-asan" -DCMAKE_BUILD_TYPE=RelWithDebInfo $extra \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS"
            cmake --build "$d/build-asan" -j"$(nproc)"
            sudo cmake --install "$d/build-asan"
          done
          sudo ldconfig
      # ASAN + UBSan pass over the codec tests, including the hostile-pixel-data corpora
      # (codec_*_hostile_test.go). `go test -asan` instruments the Go heap and the cgo boundary; the
      # ASAN-rebuilt C libraries above add the codec internals, so a heap-buffer-overflow,
      # use-after-free, or undefined-behaviour fault on a malformed JPEG/JPEG2000/JPEG-LS/HTJ2K
      # codestream aborts the test instead of silently corrupting memory. halt_on_error=1 and
      # abort_on_error=1 make the FIRST fault fail the job; print_stacktrace=1 names the offending
      # frame. -asan is supported on linux/amd64 (this runner) but NOT darwin/arm64, so this pass is
      # CI-only — it does not run on a macOS dev box. If a sanitizer flags a real fault, fix it; do
      # not suppress it.
      - name: ASAN + UBSan pass over codec tests (hostile pixel data)
        env:
          # cgo must compile the C boundary with clang too, so it links the SAME clang shared ASAN
          # runtime the codec libs were rebuilt against above; a GCC-compiled cgo boundary would pull in
          # GCC's static libasan and the two runtimes would clash at load.
          CC: clang
          CXX: clang++
          CGO_CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -shared-libasan"
          CGO_LDFLAGS: "-fsanitize=address,undefined -shared-libasan"
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0:print_stacktrace=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1"
        run: go test -asan -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./dicom/...

  phi-sanity:
    # The PHI-default sweep (internal/phisweep) asserts the project's "no PHI in logs unless the
    # operator opts in" invariant: it exercises the logging surface and fails if a patient identifier
    # reaches an output sink under the default configuration. GOWORK=off scopes the run to the root
    # module (the package lives there); the test uses synthetic sentinels only — never real PHI.
    name: PHI-default log sweep
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: PHI sweep
        run: mise run phi-sweep

  fuzz:
    # Bounded fuzz smoke run over every committed fuzz target. This is a regression gate, not a fuzz
    # campaign: each target runs for a fixed -fuzztime against its committed seed corpus so a parser
    # crash, panic, or hang on malformed input fails the build. The target list is DISCOVERED from
    # `go test -list` (see the mise `fuzz` task) so it cannot drift out of step with the tree; a
    # go-test fuzz run takes ONE target per invocation, so each is run with an anchored -fuzz regex
    # (^Name$) to exercise exactly that target. Each invocation is wrapped in coreutils `timeout`
    # (present on the runner) at a wall-clock budget above -fuzztime, so a target that wedges instead
    # of finishing exits non-zero and the gate bites — a hang is a FAILURE, never a skip.
    name: Bounded fuzz smoke (all targets)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Fuzz targets (bounded, hang = failure)
        run: mise run fuzz

  hostile-corpus:
    # Hostile-input memory-capped corpus gate. Replays the committed malformed-input corpus
    # (dicomweb/testdata/malformed plus every Go-fuzz seed corpus) through its parsers under an
    # ENFORCED memory ceiling (GOMEMLIMIT) and a wall-clock timeout, asserting no parser OOMs, panics,
    # or hangs on hostile bytes. This is distinct from the `fuzz` job (which mutates outward from the
    # seeds for a fixed budget): this gate proves the FIXED, committed corpus survives a tight memory
    # cap on every run — the in-process trust-boundary defence of PRD §9.3. GOWORK=off scopes it to the
    # root module; the harness lives at internal/hostilecorpus and the run is driven by the
    # `hostile:corpus` mise task so CI and `mise run hostile:corpus` stay in agreement.
    name: Hostile-input corpus (memory-capped, OOM/panic/hang = failure)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Point the Go caches outside the checkout via a step: $RUNNER_TEMP is a shell variable here,
      # whereas ${{ runner.temp }} in a job-level env block is an invalid context that fails the
      # workflow at parse time (a startup failure with zero jobs).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Replay malformed corpus under the memory cap
        run: mise run hostile:corpus

  benchmark-baseline:
    # Run every dicom and fhir benchmark once (-benchtime=1x, -run='^$' so no unit tests run) so the
    # benchmark code and its committed baselines (docs/conformance/benchmarks/) cannot rot
    # unnoticed: a benchmark that no longer compiles or panics fails the build. This is the pure-Go
    # default build, so the cgo-tagged codec benchmarks are excluded; the codecs job covers those.
    # GOWORK=off scopes the run to the root module.
    name: Benchmark baseline (dicom + fhir, run-once)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Run dicom + fhir benchmarks once
        run: mise run bench

  conformance-drift:
    # The conformance-drift check (tools/conformance-drift) fails when a conformance statement under
    # docs/ and the code it describes diverge — preset counts, NOT-YET-SHIPPED banners, and the
    # per-package Stability: godoc markers. GOWORK=off scopes the run to the root module.
    name: Conformance-drift check
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin Go caches to runner-temp via a step (the runner context is invalid in a job-level env).
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/.gocache/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/.gocache/build" >> "$GITHUB_ENV"
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.gocache/mod
            ${{ runner.temp }}/.gocache/build
          key: go-1.26.4-${{ runner.os }}-root-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-1.26.4-${{ runner.os }}-root-
      - name: Conformance-drift
        run: mise run conformance-drift

  docs:
    # Build the mkdocs conformance site with --strict so navigation drift (a statement missing from
    # the nav, or a nav entry pointing at a missing file) fails the build. mkdocs and the material
    # theme are installed from PyPI at exact pins (tools/versions, mkdocs.* keys) so the site build is
    # reproducible rather than dependent on whatever the runner resolves at install time.
    name: Docs site build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned mkdocs toolchain
        # Exact == pins keep the strict build reproducible; bumping either is a deliberate change
        # recorded in tools/versions alongside this install site.
        run: python3 -m pip install 'mkdocs==1.6.1' 'mkdocs-material==9.6.21'
      - name: Build site (strict)
        run: mkdocs build --strict

  tracked-binary-hygiene:
    # cmd/radx is committed as source only; the compiled radx binary is gitignored. Guard that
    # invariant: fail if any tracked file under cmd/ is a compiled object (a Mach-O, ELF executable,
    # PIE, shared library, object, or static archive), which would mean a build artefact slipped past
    # .gitignore into version control. `file` ships on the runner; the per-file loop sets a status
    # flag and exits non-zero at the end so the failure propagates (a `git ls-files | while … exit`
    # pipeline would exit only its subshell and pass silently).
    name: Tracked-binary hygiene (cmd/ is source-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail on any tracked compiled binary under cmd/
        run: |
          status=0
          while IFS= read -r f; do
            mime="$(file --mime --brief "$f")"
            case "$mime" in
              # Mach-O (darwin), ELF executable/PIE/shared object (linux), object/archive, and PE
              # (windows .exe via cross-compile) — every compiled artefact a `go build` can emit.
              application/x-mach-binary* | application/x-executable* | application/x-pie-executable* | application/x-sharedlib* | application/x-object* | application/x-archive* | application/x-dosexec* | application/vnd.microsoft.portable-executable*)
                echo "tracked compiled binary under cmd/: $f ($mime)" >&2
                status=1
                ;;
            esac
          done < <(git ls-files cmd/)
          exit "$status"
