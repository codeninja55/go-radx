# CI for the go-radx re-foundation.
#
# Design: the default build is pure-Go (CGO_ENABLED=0); the C-backed pixel codecs live behind the
# dicom_openjpeg / dicom_libjpeg / dicom_charls build tags, so only the `codecs` job needs the native
# libraries (built from source, since Ubuntu apt ships older versions than the codecs require). The
# conformance gate (tools/dicom-conformance) skips on a dev box but FAILS when CI=true, so this is
# where it runs for real — validating go-radx's writer output, not the borrowed fixture corpus.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt Node20-based actions (jdx/mise-action) into the Node24 runtime ahead of the forced migration,
# silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    name: Lint, vet, build, race tests (pure-Go default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs Go 1.26 + golangci-lint 2.12.2 per mise.toml [tools]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (default build)
        run: mise exec -- golangci-lint run ./...
      - name: golangci-lint (interop build tag)
        run: mise exec -- golangci-lint run --build-tags interop ./...
      - name: build
        run: go build ./...
      - name: race tests (default build; race needs cgo but no codec libs)
        run: go test -race ./...

  conformance:
    name: DICOM conformance (dciodvfy + pydicom, enforced)
    runs-on: ubuntu-latest
    env:
      CI: "true" # flips tools/dicom-conformance/*.sh from skip-locally to fail-if-tool-absent
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dicom3tools (provides dciodvfy) + pydicom
        run: |
          # dciodvfy is a David Clunie dicom3tools program (Ubuntu universe), NOT a dcmtk tool —
          # dcmtk ships no IOD validator. The first CI run installed dcmtk and the gate correctly
          # failed because dciodvfy was absent.
          sudo apt-get update
          sudo apt-get install -y dicom3tools python3-pip
          python3 -m pip install --break-system-packages pydicom
      - name: DICOM IOD validation (dciodvfy)
        run: mise run dicom:dciodvfy
      - name: pydicom round-trip
        run: mise run dicom:pydicom

  interop:
    name: DIMSE interop gate (testcontainers — Orthanc + dcm4chee-arc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: DIMSE interop tests
        # GitHub-hosted ubuntu runners ship Docker; testcontainers manages the Orthanc and
        # dcm4chee-arc stacks. The dcm4chee-arc stack (LDAP + PostgreSQL + WildFly) is memory-heavy
        # for a standard runner — watch this job if the runner is resource-constrained.
        run: go test -tags interop -count=1 ./dimse/integration/...

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - name: Install govulncheck
        # Pin the scanner to a released version so its analysis behaviour is fixed; @latest would
        # let the scanner float between runs. The vulnerability database stays live (vuln.go.dev),
        # so a newly disclosed advisory still fails the gate.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck
        run: govulncheck ./...

  codecs:
    # The C-backed pixel codecs are pinned to OpenJPEG 2.5.4, libjpeg-turbo 3.1.4, and CharLS 2.4.3
    # (the versions the local build links via Homebrew). Ubuntu apt ships older releases — notably
    # libjpeg-turbo 2.x, which lacks the TJPARAM_LOSSLESS API codec_libjpeg.go uses — so the
    # libraries are built from source here.
    name: CGo pixel codecs (native libs from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config nasm curl
      - name: Build & install OpenJPEG 2.5.4
        run: |
          curl -fsSL https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz | tar -xz
          cmake -S openjpeg-2.5.4 -B openjpeg-2.5.4/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build openjpeg-2.5.4/build -j"$(nproc)"
          sudo cmake --install openjpeg-2.5.4/build
      - name: Build & install libjpeg-turbo 3.1.4
        run: |
          curl -fsSL https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4/libjpeg-turbo-3.1.4.tar.gz | tar -xz
          # libjpeg-turbo's cmake defaults CMAKE_INSTALL_PREFIX to /opt/libjpeg-turbo (unlike OpenJPEG
          # and CharLS, which default to /usr/local) — pin it so libturbojpeg.pc lands where the
          # others do and pkg-config discovery finds it.
          cmake -S libjpeg-turbo-3.1.4 -B libjpeg-turbo-3.1.4/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build libjpeg-turbo-3.1.4/build -j"$(nproc)"
          sudo cmake --install libjpeg-turbo-3.1.4/build
      - name: Build & install CharLS 2.4.3
        run: |
          curl -fsSL https://github.com/team-charls/charls/archive/refs/tags/2.4.3.tar.gz | tar -xz
          cmake -S charls-2.4.3 -B charls-2.4.3/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build charls-2.4.3/build -j"$(nproc)"
          sudo cmake --install charls-2.4.3/build
      - name: Refresh linker cache
        run: sudo ldconfig
      # Discover where each from-source cmake installed its .pc and .so files under /usr/local and
      # export them for the build/test/lint steps, instead of hardcoding a libdir that the three libs
      # disagree on (lib vs lib64 vs a multiarch dir).
      - name: Resolve pkg-config and linker paths
        run: |
          pc="$(find /usr/local -type d -name pkgconfig 2>/dev/null | sort -u | paste -sd: -)"
          libs="$(find /usr/local -type f -name 'lib*.so*' -printf '%h\n' 2>/dev/null | sort -u | paste -sd: -)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libs" >> "$GITHUB_ENV"
      # Split into three steps so the job summary pinpoints which fails on Linux (the combined
      # step passes locally on macOS): the cgo build/link, the codec tests, or the tagged lint.
      - name: Build with codec tags
        run: go build -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
      - name: Test with codec tags
        run: go test -tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./dicom/...
      - name: Lint with codec tags
        run: mise exec -- golangci-lint run --build-tags "dicom_openjpeg dicom_libjpeg dicom_charls" ./...
